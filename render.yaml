services:
  - type: web
    name: tele-expense-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_WORKSHEET_NAME
        value: Expenses
      - key: TIMEZONE
        value: Asia/Singapore
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: WEBHOOK_PATH
        value: /webhook
      - key: WEBHOOK_SECRET_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: INFO
